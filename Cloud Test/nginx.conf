# ══════════════════════════════════════════════════════════════════════════════
# nginx.conf — Reverse Proxy fuer AIVA Health
# ══════════════════════════════════════════════════════════════════════════════
#
# Was ist ein Reverse Proxy?
# ──────────────────────────
# Nginx nimmt ALLE Anfragen auf Port 80 entgegen und entscheidet:
#   - /api/*        → weiterleiten an das Backend (Express-Server)
#   - alles andere  → die React-App (statische Dateien) ausliefern
#
# Der Nutzer merkt davon nichts — fuer ihn sieht es so aus,
# als kaeme alles von einem einzigen Server.
#
#   Browser:  http://192.168.x.x/care        → React-App
#   Browser:  http://192.168.x.x/api/health  → Backend-API
#
# Warum brauchen wir das?
# ───────────────────────
# 1. In Produktion laeuft KEIN Vite-Dev-Server mehr
#    (der hatte den Proxy in vite.config.js eingebaut)
# 2. Wir wollen nur EINEN Port (80) nach aussen oeffnen
# 3. Sicherheit: Das Backend ist nicht direkt erreichbar
#
# Diese Datei wird per docker-compose.yml in den Container gemountet:
#   volumes:
#     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
# ══════════════════════════════════════════════════════════════════════════════

server {
    # ─── Port 80 = HTTP (Standard-Webport) ───────────────────────────────
    listen 80;

    # server_name _ = akzeptiert ALLE Hostnamen.
    # Egal ob der Nutzer ueber IP (192.168.x.x) oder Domain zugreift.
    server_name _;

    # ─── FRONTEND: React Single Page App ─────────────────────────────────
    # Alle Anfragen, die NICHT mit /api/ beginnen, landen hier.
    location / {
        # Verzeichnis, in dem die gebauten React-Dateien liegen.
        # (Wurden per Dockerfile.frontend hierhin kopiert)
        root /usr/share/nginx/html;
        index index.html;

        # ─── try_files: DER Schluessel fuer React Router! ───────────────
        #
        # Problem ohne try_files:
        #   User oeffnet http://192.168.x.x/care
        #   → Nginx sucht nach einer Datei namens "care" → gibt es nicht → 404!
        #
        # Mit try_files:
        #   $uri         → Gibt es eine Datei mit diesem Namen? (z.B. style.css) → ausliefern
        #   $uri/        → Gibt es einen Ordner mit diesem Namen? → Nein
        #   /index.html  → Fallback: Lade index.html → React Router uebernimmt
        #
        # React Router liest dann die URL (/care) und zeigt die richtige Seite an.
        # Das nennt man "Client-Side Routing" — das Routing passiert im Browser,
        # nicht auf dem Server.
        try_files $uri $uri/ /index.html;
    }

    # ─── BACKEND: API Reverse Proxy ──────────────────────────────────────
    # Alle Anfragen, die mit /api/ beginnen, werden an das Backend
    # weitergeleitet (= "proxied").
    location /api/ {
        # resolver 127.0.0.11 = Docker's eingebauter DNS-Server.
        # Ohne diese Zeile loest Nginx "backend" NUR beim Start auf.
        # Falls das Backend zu dem Zeitpunkt noch nicht laeuft, stuerzt
        # Nginx sofort ab (host not found) → Restart-Loop!
        # Mit resolver loest Nginx den Namen bei JEDER Anfrage neu auf.
        # valid=30s = Cache fuer 30 Sekunden (verhindert zu viele DNS-Anfragen).
        resolver 127.0.0.11 valid=30s;

        # set $backend = speichert die URL in einer Variable.
        # Das ist noetig, damit der resolver greift: Nginx loest Variablen
        # erst zur Laufzeit auf, statische proxy_pass-URLs beim Start.
        set $backend http://backend:3001;
        proxy_pass $backend;

        # ─── Header an das Backend weiterleiten ─────────────────────────
        # Ohne diese Header wuesste das Backend nicht, woher die Anfrage
        # urspruenglich kam (es sieht nur die interne Docker-IP).

        # Host: Der Original-Hostname (z.B. 192.168.x.x)
        proxy_set_header Host $host;

        # X-Real-IP: Die echte IP-Adresse des Nutzers
        proxy_set_header X-Real-IP $remote_addr;

        # X-Forwarded-For: Kette aller Proxies, durch die die Anfrage ging
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # X-Forwarded-Proto: http oder https (wichtig fuer Redirects)
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
