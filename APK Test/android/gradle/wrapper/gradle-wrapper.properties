# ══════════════════════════════════════════════════════════════════════════════
# gradle-wrapper.properties — Gradle-Version und Download-Konfiguration
# ══════════════════════════════════════════════════════════════════════════════
#
# Was ist der Gradle Wrapper?
# ──────────────────────────
# Der Gradle Wrapper (gradlew / gradlew.bat) sorgt dafuer, dass JEDER
# Entwickler exakt die gleiche Gradle-Version nutzt, ohne Gradle global
# installieren zu muessen. Beim ersten Aufruf von "./gradlew" wird die
# hier definierte Version automatisch heruntergeladen.
#
# distributionUrl = URL, von der Gradle 8.2.1 heruntergeladen wird
# networkTimeout  = Timeout in Millisekunden fuer den Download (10 Sekunden)
# validateDistributionUrl = Prueft, ob die URL gueltig ist
#
# ══════════════════════════════════════════════════════════════════════════════

# Lokaler Speicherort fuer die heruntergeladene Gradle-Distribution
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists

# Gradle 8.2.1 (vollstaendige Distribution inkl. Dokumentation und Quellcode)
# "-all" statt "-bin" ermoeglicht Code-Completion in der IDE.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.2.1-all.zip

# Download-Timeout: 10 Sekunden. Bei langsamer Verbindung ggf. erhoehen.
networkTimeout=10000

# URL-Validierung: Schutzt vor Tippfehlern in der distributionUrl
validateDistributionUrl=true

# Lokaler Speicherort fuer die entpackte Distribution
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
