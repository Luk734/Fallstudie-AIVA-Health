// ══════════════════════════════════════════════════════════════════════════════
// gradle.properties — Globale Gradle-Einstellungen fuer den Build-Prozess
// ══════════════════════════════════════════════════════════════════════════════
//
// Was ist diese Datei?
// ────────────────────
// Hier werden Einstellungen fuer Gradle selbst definiert (NICHT fuer die App).
// Diese Properties beeinflussen, wie Gradle laeuft: Speicher, Parallelisierung,
// und welche Android-Libraries verwendet werden.
//
// ══════════════════════════════════════════════════════════════════════════════

# ─── JVM SPEICHER ────────────────────────────────────────────────────────────
# Gradle laeuft in einer JVM (Java Virtual Machine). Standardmaessig bekommt
# diese nur wenig Speicher. Bei grossen Projekten fuehrt das zu OutOfMemory-Fehlern.
# -Xmx1536m = Maximal 1,5 GB RAM fuer den Gradle-Daemon.
org.gradle.jvmargs=-Xmx1536m

# ─── PARALLELISIERUNG ───────────────────────────────────────────────────────
# Wenn aktiviert, baut Gradle unabhaengige Module gleichzeitig (schneller!).
# Ist hier auskommentiert, weil unsere Module Abhaengigkeiten zueinander haben.
# org.gradle.parallel=true

# ─── ANDROIDX AKTIVIEREN ─────────────────────────────────────────────────────
# Stellt sicher, dass AndroidX-Libraries statt der alten Support-Libraries genutzt werden.
# AndroidX ist der moderne Standard seit 2018. Ohne dieses Flag wuerde Gradle
# die veralteten "android.support.*" Pakete verwenden, die nicht mehr gepflegt werden.
android.useAndroidX=true
